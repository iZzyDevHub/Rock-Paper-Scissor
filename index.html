<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="stone.ico">
</head>
<body>


<!-- Keep your top section / title here -->
<h1 class="title">ROCK PAPER SCISSORS</h1>

<!-- 1. The Buttons Container (Stays on top) -->
<div class="buttons-container"> 
    <button id="rock-btn">ROCK</button>
    <button id="paper-btn">PAPER</button>
    <button id="scissor-btn">SCISSOR</button>
</div>

<!-- 2. The Score Board (Moved right under the buttons) -->
<div class="scoreboard">
    <div class="player-side">
        <h2>PLAYER</h2>
        <span id="player-score">0</span>
    </div>
    
    <div class="computer-side">
        <h2>COMPUTER</h2>
        <span id="computer-score">0</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
